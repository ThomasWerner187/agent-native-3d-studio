name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:animations
      - run: npm run test:lofi
      - name: Install chromium for the smoke test
        run: npx playwright-core install --with-deps chromium
      - name: Smoke-test all tools
        run: node scripts/smoke.mjs
      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: scripts/smoke-result.json
